<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北朝鮮風スローガンジェネレーター</title>
  <style>
    @font-face {
      font-family: 'TamanegiGeki';
      src: url('./玉ねぎ楷書激無料版v7改.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a1a;
      background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('./Mansudae_Grand_Monument_05bg.jpg');
      background-repeat: no-repeat;
      background-position: top center;
      background-attachment: fixed;
      background-size: cover;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .site-title {
      margin: 5px 0;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .control-panel {
      background: rgba(42, 42, 42, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid #444;
      padding: 12px 15px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group label {
      font-size: 13px;
      font-weight: bold;
      color: #ccc;
    }

    .char-count { font-size: 11px; color: #aaa; }

    textarea {
      width: 100%;
      height: 60px;
      padding: 8px 12px;
      font-size: 16px;
      border: 2px solid #444;
      background-color: #1a1a1a;
      color: #fff;
      border-radius: 6px;
      outline: none;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus { border-color: #e61919; }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .controls-left {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-item label {
      font-size: 12px;
      font-weight: bold;
      color: #ccc;
    }

    input[type="range"] {
      accent-color: #e61919;
      cursor: pointer;
      width: 90px;
    }

    input[type="number"] {
      width: 55px;
      padding: 4px;
      font-size: 13px;
      border: 2px solid #444;
      background-color: #1a1a1a;
      color: #fff;
      border-radius: 6px;
      outline: none;
      text-align: center;
    }

    .color-picker { display: flex; gap: 6px; }

    .color-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 6px;
      font-size: 12px;
      color: #fff;
    }

    .color-btn input { display: none; }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.3);
    }

    .color-dot.white { background-color: #ffffff; }
    .color-dot.yellow { background-color: #fff200; }

    .color-btn:has(input:checked) {
      border-color: #e61919;
      background-color: #333;
    }

    .save-btn {
      background-color: #e61919;
      color: #ffffff;
      border: none;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      max-width: 150px;
    }

    .poster-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 5px 0;
    }

    /* プレビュー用キャンバス */
    canvas {
      max-width: 100%;
      height: auto;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      border-radius: 2px;
    }

    /* 画像モーダル（長押し保存用） */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-overlay img {
      max-width: 100%;
      max-height: 70vh;
      border: 2px solid #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-note {
      margin-top: 15px;
      font-size: 14px;
      color: #fff;
      text-align: center;
    }

    .modal-close-btn {
      margin-top: 15px;
      background: #444;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body { padding: 5px; }
      .controls-row, .controls-left { flex-direction: column; align-items: stretch; gap: 8px; }
      .control-item { width: 100%; justify-content: space-between; }
      input[type="range"] { flex-grow: 1; max-width: 160px; }
      .save-btn { max-width: 100%; margin-top: 5px; font-size: 14px; padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="site-title">北朝鮮風スローガンジェネレーター</h1>
    
    <div class="control-panel">
      <div class="input-group">
        <div class="input-header">
          <label for="userInput">文字入力（Enterで改行可）</label>
          <span class="char-count" id="charCount">9 / 50</span>
        </div>
        <textarea id="userInput" maxlength="50" placeholder="表示したい文字を入力...">偉大なる人民万歳！</textarea>
      </div>

      <div class="controls-row">
        <div class="controls-left">
          <div class="control-item">
            <label for="textSize">サイズ:</label>
            <input type="range" id="textSize" min="20" max="200" value="70">
            <div><input type="number" id="textSizeInput" min="20" max="200" value="70"> px</div>
          </div>

          <div class="control-item">
            <label for="letterSpacing">文字間隔:</label>
            <input type="range" id="letterSpacing" min="-10" max="50" value="2">
            <div><input type="number" id="letterSpacingInput" min="-10" max="50" value="2"> px</div>
          </div>

          <div class="control-item">
            <label>文字の色:</label>
            <div class="color-picker">
              <label class="color-btn">
                <input type="radio" name="textColor" value="#ffffff" checked>
                <span class="color-dot white"></span> 白
              </label>
              <label class="color-btn">
                <input type="radio" name="textColor" value="#fff200">
                <span class="color-dot yellow"></span> 黄
              </label>
            </div>
          </div>
        </div>

        <button id="downloadBtn" class="save-btn">画像として保存</button>
      </div>
    </div>

    <!-- 描画エリア（Canvas） -->
    <div class="poster-wrapper">
      <canvas id="posterCanvas" width="1000" height="300"></canvas>
    </div>
  </div>

  <!-- スマホ保存用ポップアップ -->
  <div class="modal-overlay" id="modalOverlay">
    <img id="resultImage" src="" alt="生成画像">
    <p class="modal-note">画像を長押しして「"写真"に追加」または「保存」を選択してください</p>
    <button class="modal-close-btn" id="modalCloseBtn">閉じる</button>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const charCount = document.getElementById('charCount');
    const textSize = document.getElementById('textSize');
    const textSizeInput = document.getElementById('textSizeInput');
    const letterSpacing = document.getElementById('letterSpacing');
    const letterSpacingInput = document.getElementById('letterSpacingInput');
    const colorRadios = document.querySelectorAll('input[name="textColor"]');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const modalOverlay = document.getElementById('modalOverlay');
    const resultImage = document.getElementById('resultImage');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    // フォント読み込み完了を待って描画
    document.fonts.ready.then(() => {
      drawPoster();
    });

    function drawPoster() {
      const text = userInput.value || '文字を入力';
      const fontSize = parseInt(textSize.value, 10);
      const spacing = parseInt(letterSpacing.value, 10);
      const color = document.querySelector('input[name="textColor"]:checked').value;

      const lines = text.split('\n');
      const lineHeight = fontSize * 1.25;

      // 看板のサイズ決定
      const canvasWidth = 1000;
      const minHeight = 220;
      const calculatedHeight = Math.max(minHeight, lines.length * lineHeight + 80);

      canvas.width = canvasWidth;
      canvas.height = calculatedHeight;

      // 1. 赤背景を描画
      ctx.fillStyle = '#e61919';
      ctx.fillRect(0, 0, canvasWidth, calculatedHeight);

      // 2. 文字の設定
      ctx.font = `${fontSize}px "TamanegiGeki", sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 影の設定
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 3;
      ctx.shadowBlur = 4;

      // 3. テキストを描画（文字間隔を手動調整）
      const startY = (calculatedHeight / 2) - ((lines.length - 1) * lineHeight / 2);

      lines.forEach((line, index) => {
        const y = startY + (index * lineHeight);
        
        // 文字間隔（letter-spacing）を1文字ずつ処理
        if (spacing === 0) {
          ctx.fillText(line, canvasWidth / 2, y);
        } else {
          const chars = line.split('');
          let totalWidth = 0;
          const charWidths = chars.map(c => ctx.measureText(c).width);
          totalWidth = charWidths.reduce((a, b) => a + b, 0) + (chars.length - 1) * spacing;

          let startX = (canvasWidth / 2) - (totalWidth / 2);

          chars.forEach((char, i) => {
            const charW = charWidths[i];
            ctx.fillText(char, startX + (charW / 2), y);
            startX += charW + spacing;
          });
        }
      });
    }

    // イベントリスナー設定
    userInput.addEventListener('input', (e) => {
      charCount.textContent = `${e.target.value.length} / 50`;
      drawPoster();
    });

    textSize.addEventListener('input', (e) => {
      textSizeInput.value = e.target.value;
      drawPoster();
    });
    textSizeInput.addEventListener('input', (e) => {
      if (e.target.value !== '') {
        textSize.value = e.target.value;
        drawPoster();
      }
    });

    letterSpacing.addEventListener('input', (e) => {
      letterSpacingInput.value = e.target.value;
      drawPoster();
    });
    letterSpacingInput.addEventListener('input', (e) => {
      if (e.target.value !== '') {
        letterSpacing.value = e.target.value;
        drawPoster();
      }
    });

    colorRadios.forEach(radio => {
      radio.addEventListener('change', drawPoster);
    });

    // 保存処理（軽量・直接変換）
    downloadBtn.addEventListener('click', () => {
      const imgData = canvas.toDataURL('image/png');
      resultImage.src = imgData;
      modalOverlay.classList.add('active');

      // PC用自動ダウンロード
      const link = document.createElement('a');
      link.download = `slogan_poster_${Date.now()}.png`;
      link.href = imgData;
      link.click();
    });

    modalCloseBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });
  </script>

</body>
</html>
