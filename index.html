<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北朝鮮風スローガンジェネレーター</title>
  <!-- HTML要素を画像化するライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* フォントファイルの読み込み */
    @font-face {
      font-family: 'TamanegiGeki';
      src: url('./玉ねぎ楷書激無料版v7改.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a1a;
      background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('./Mansudae_Grand_Monument_05bg.jpg');
      background-repeat: no-repeat;
      background-position: top center;
      background-attachment: fixed;
      background-size: cover;
      color: #ffffff;
      margin: 0;
      padding: 10px; /* 余白を最小限に */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden; /* 横スクロールの発生を予防 */
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 15px; /* 要素間の間隔を詰める */
      align-items: center;
    }

    /* サイトタイトル表示 */
    .site-title {
      margin: 5px 0;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 操作パネル */
    .control-panel {
      background: rgba(42, 42, 42, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid #444;
      padding: 12px 15px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group label {
      font-size: 13px;
      font-weight: bold;
      color: #ccc;
    }

    .char-count {
      font-size: 11px;
      color: #aaa;
    }

    textarea {
      width: 100%;
      height: 60px; /* 入力欄を少し低く */
      padding: 8px 12px;
      font-size: 16px;
      border: 2px solid #444;
      background-color: #1a1a1a;
      color: #fff;
      border-radius: 6px;
      outline: none;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #e61919;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .controls-left {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-item label {
      font-size: 12px;
      font-weight: bold;
      color: #ccc;
    }

    input[type="range"] {
      accent-color: #e61919;
      cursor: pointer;
      width: 90px;
    }

    /* 数字入力フォームのスタイル */
    input[type="number"] {
      width: 55px;
      padding: 4px;
      font-size: 13px;
      border: 2px solid #444;
      background-color: #1a1a1a;
      color: #fff;
      border-radius: 6px;
      outline: none;
      text-align: center;
    }

    /* 文字色切替ラジオボタン */
    .color-picker {
      display: flex;
      gap: 6px;
    }

    .color-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 6px;
      font-size: 12px;
      color: #fff;
    }

    .color-btn input {
      display: none;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.3);
    }

    .color-dot.white { background-color: #ffffff; }
    .color-dot.yellow { background-color: #fff200; }

    .color-btn:has(input:checked) {
      border-color: #e61919;
      background-color: #333;
    }

    /* 画像保存ボタン */
    .save-btn {
      background-color: #e61919;
      color: #ffffff;
      border: none;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%; /* スマホ時はボタンを押しやすく押し広げる */
      max-width: 150px;
    }

    .save-btn:hover {
      background-color: #ff2a2a;
    }

    /* プレビュー表示エリア */
    .poster-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 5px 0;
    }

    .poster-box {
      width: 100%;
      max-width: 1100px; /* PCでは最大1100px、スマホでは画面幅に合わせて伸縮 */
      /* min-height を固定値から auto へ変更し、スマホでの高さを確保 */
      min-height: 150px; 
      background-color: #e61919;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      border-radius: 2px;
      border: 6px solid #ffffff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      flex-shrink: 0;
    }

    /* 文字デザイン */
    .poster-text {
      font-family: 'TamanegiGeki', sans-serif;
      /* スマホ用の初期サイズ */
      font-size: 40px; 
      color: #ffffff;
      text-align: center;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.1;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    /* スマホ（画面幅768px以下）向けのレスポンシブ調整 */
    @media (max-width: 768px) {
      body {
        padding: 5px;
      }
      
      .site-title {
        font-size: 16px;
      }

      .control-panel {
        padding: 10px;
      }

      .controls-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .controls-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .control-item {
        width: 100%;
        justify-content: space-between;
      }

      input[type="range"] {
        flex-grow: 1;
        max-width: 160px;
      }

      .color-picker {
        flex-grow: 1;
        justify-content: flex-end;
      }

      .save-btn {
        max-width: 100%;
        margin-top: 5px;
        font-size: 14px;
        padding: 10px;
      }

      .poster-box {
        border-width: 4px;
        padding: 10px;
        /* スマホでの看板の最小高さをPCより少し高く確保 */
        min-height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="site-title">北朝鮮風スローガンジェネレーター</h1>
    
    <!-- 操作エリア -->
    <div class="control-panel">
      <div class="input-group">
        <div class="input-header">
          <label for="userInput">文字入力（Enterで改行可）</label>
          <span class="char-count" id="charCount">9 / 50</span>
        </div>
        <textarea id="userInput" maxlength="50" placeholder="表示したい文字を入力...">偉大なる人民万歳！</textarea>
      </div>

      <div class="controls-row">
        <div class="controls-left">
          <!-- 文字サイズ選択 -->
          <div class="control-item">
            <label for="textSize">サイズ:</label>
            <input type="range" id="textSize" min="10" max="300" value="40">
            <div><input type="number" id="textSizeInput" min="10" max="300" value="40"> px</div>
          </div>

          <!-- 文字間隔選択 -->
          <div class="control-item">
            <label for="letterSpacing">文字間隔:</label>
            <input type="range" id="letterSpacing" min="-10" max="50" value="2">
            <div><input type="number" id="letterSpacingInput" min="-10" max="50" value="2"> px</div>
          </div>

          <!-- 文字色選択 -->
          <div class="control-item">
            <label>文字の色:</label>
            <div class="color-picker">
              <label class="color-btn">
                <input type="radio" name="textColor" value="#ffffff" checked>
                <span class="color-dot white"></span> 白
              </label>
              <label class="color-btn">
                <input type="radio" name="textColor" value="#fff200">
                <span class="color-dot yellow"></span> 黄
              </label>
            </div>
          </div>
        </div>

        <!-- 画像保存ボタン -->
        <button id="downloadBtn" class="save-btn">画像として保存</button>
      </div>
    </div>

    <!-- 看板プレビューエリア -->
    <div class="poster-wrapper">
      <div class="poster-box" id="poster">
        <div class="poster-text" id="outputText">偉大なる人民万歳！</div>
      </div>
    </div>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const outputText = document.getElementById('outputText');
    const charCount = document.getElementById('charCount');
    const textSize = document.getElementById('textSize');
    const textSizeInput = document.getElementById('textSizeInput');
    const letterSpacing = document.getElementById('letterSpacing');
    const letterSpacingInput = document.getElementById('letterSpacingInput');
    const colorRadios = document.querySelectorAll('input[name="textColor"]');
    const downloadBtn = document.getElementById('downloadBtn');
    const poster = document.getElementById('poster');

    // 初期処理：デバイスに応じてフォントサイズを自動調整
    function setInitialFontSize() {
      if (window.innerWidth <= 768) {
        // スマホなら40px
        updateFontSize(40);
      } else {
        // PCなら80px
        updateFontSize(80);
      }
    }
    
    // 画面読み込み時に実行
    setInitialFontSize();

    // 文字列のリアルタイム変更＆文字数カウント更新
    userInput.addEventListener('input', (e) => {
      const val = e.target.value;
      outputText.textContent = val || '文字を入力';
      charCount.textContent = `${val.length} / 50`;
    });

    // 文字サイズ更新
    function updateFontSize(val) {
      outputText.style.fontSize = val + 'px';
      textSize.value = val;
      textSizeInput.value = val;
    }

    textSize.addEventListener('input', (e) => updateFontSize(e.target.value));
    textSizeInput.addEventListener('input', (e) => {
      if (e.target.value !== '') updateFontSize(e.target.value);
    });

    // 文字間隔更新
    function updateLetterSpacing(val) {
      outputText.style.letterSpacing = val + 'px';
      letterSpacing.value = val;
      letterSpacingInput.value = val;
    }

    letterSpacing.addEventListener('input', (e) => updateLetterSpacing(e.target.value));
    letterSpacingInput.addEventListener('input', (e) => {
      if (e.target.value !== '') updateLetterSpacing(e.target.value);
    });

    // 文字色変更
    colorRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        outputText.style.color = e.target.value;
      });
    });

    // 画像ダウンロード機能
    downloadBtn.addEventListener('click', () => {
      downloadBtn.innerText = '生成中...';
      html2canvas(poster, {
        scale: 2, // 高解像度化
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `slogan_poster_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        downloadBtn.innerText = '画像として保存';
      }).catch(err => {
        console.error(err);
        downloadBtn.innerText = '画像として保存';
      });
    });
  </script>

</body>
</html>
